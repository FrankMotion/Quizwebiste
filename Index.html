<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Elektrotechnik & Informatik</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .question-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        h3 {
            margin-top: 0;
            color: #34495e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        td {
            border: 1px solid #ddd;
            padding: 10px;
            width: 25%; /* Teilt die 4 Antworten gleichmäßig auf */
            vertical-align: middle;
            background-color: #fafafa;
            transition: background-color 0.3s;
        }
        td:hover {
            background-color: #e8f4f8;
        }
        label {
            display: block;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        input[type="radio"] {
            margin-right: 8px;
        }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2980b9;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #3498db;
        }
        #result {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>Basics Quiz: Elektrotechnik & Informatik</h1>

    <div id="quiz-form">
        
        <div class="question-container">
            <h3>1. Was ist die Maßeinheit für den elektrischen Widerstand?</h3>
            <table>
                <tr>
                    <td><label><input type="radio" name="q1" value="wrong"> Ampere (A)</label></td>
                    <td><label><input type="radio" name="q1" value="wrong"> Volt (V)</label></td>
                    <td><label><input type="radio" name="q1" value="correct"> Ohm (Ω)</label></td>
                    <td><label><input type="radio" name="q1" value="wrong"> Watt (W)</label></td>
                </tr>
            </table>
        </div>

        <div class="question-container">
            <h3>2. Wie lautet das Ohmsche Gesetz zur Berechnung der Spannung (U)?</h3>
            <table>
                <tr>
                    <td><label><input type="radio" name="q2" value="wrong"> U = R / I</label></td>
                    <td><label><input type="radio" name="q2" value="correct"> U = R * I</label></td>
                    <td><label><input type="radio" name="q2" value="wrong"> U = I / R</label></td>
                    <td><label><input type="radio" name="q2" value="wrong"> U = P * I</label></td>
                </tr>
            </table>
        </div>

        <div class="question-container">
            <h3>3. Wofür steht die Abkürzung "HTML" in der Informatik?</h3>
            <table>
                <tr>
                    <td><label><input type="radio" name="q3" value="wrong"> High Text Machine Language</label></td>
                    <td><label><input type="radio" name="q3" value="wrong"> Hyperlink and Text Markup Language</label></td>
                    <td><label><input type="radio" name="q3" value="correct"> Hypertext Markup Language</label></td>
                    <td><label><input type="radio" name="q3" value="wrong"> Home Tool Markup Language</label></td>
                </tr>
            </table>
        </div>

        <div class="question-container">
            <h3>4. Welches Zahlensystem verwendet ein Computer auf unterster Ebene?</h3>
            <table>
                <tr>
                    <td><label><input type="radio" name="q4" value="correct"> Binärsystem</label></td>
                    <td><label><input type="radio" name="q4" value="wrong"> Dezimalsystem</label></td>
                    <td><label><input type="radio" name="q4" value="wrong"> Hexadezimalsystem</label></td>
                    <td><label><input type="radio" name="q4" value="wrong"> Oktalsystem</label></td>
                </tr>
            </table>
        </div>

        <button class="btn-submit" onclick="calculateScore()">Ergebnis auswerten</button>
        
        <div id="result"></div>

    </div>

    <script>
        function calculateScore() {
            let score = 0;
            const totalQuestions = 4;
            let answeredQuestions = 0;

            // Alle ausgewählten Radio-Buttons sammeln
            const selectedAnswers = document.querySelectorAll('input[type="radio"]:checked');
            answeredQuestions = selectedAnswers.length;

            if (answeredQuestions < totalQuestions) {
                alert("Bitte beantworte alle Fragen, bevor du abgibst!");
                return;
            }

            // Für jede richtige Antwort 1 Punkt vergeben
            selectedAnswers.forEach(answer => {
                if (answer.value === "correct") {
                    score++;
                }
            });

            // Ergebnis anzeigen
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = `Du hast ${score} von ${totalQuestions} Punkten erreicht!`;

            // Farbe je nach Punktzahl anpassen
            if (score === totalQuestions) {
                resultDiv.style.color = "#27ae60"; // Grün für alles richtig
            } else if (score >= totalQuestions / 2) {
                resultDiv.style.color = "#f39c12"; // Orange für die Hälfte
            } else {
                resultDiv.style.color = "#e74c3c"; // Rot für weniger
            }
        }
    </script>
</body>
</html>
